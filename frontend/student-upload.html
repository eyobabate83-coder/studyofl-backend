<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studyo - Study Materials</title><style>body{margin:0;min-height:100vh;background:linear-gradient(145deg,#190c33,#341a52);color:#f4f1fb;font:14px 'Trebuchet MS',sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.brand{font-size:24px;font-weight:bold}.nav{display:flex;gap:6px;overflow:auto;margin:24px 0;padding:6px;border:1px solid #ffffff33;border-radius:14px}.nav a{color:#c9c0e6;padding:10px 13px;text-decoration:none;white-space:nowrap;border-radius:10px}.nav a.active,.nav a:hover{background:#ff9d5c;color:#24102f}.panel{background:#ffffff12;border:1px solid #ffffff2b;border-radius:16px;padding:26px}.muted{color:#c9c0e6}.material{padding:14px;margin:10px 0;border:1px solid #ffffff22;border-radius:12px}.material b{display:block;margin-bottom:5px}</style></head><body><main class="wrap"><header class="top"><div class="brand">Studyo</div><div id="who"></div></header><nav class="nav"><a href="index.html">Overview</a><a class="active" href="student-upload.html">Study materials</a><a href="student-library.html">Digital library</a><a href="student-quizzes.html">Quizzes &amp; tests</a><a href="student-profile.html">Profile</a></nav><section class="panel"><h1>Study materials</h1><p class="muted">Materials shared by your teacher appear here.</p><div id="list"></div></section></main><script>const API='https://studyofl-backend.onrender.com',TOKEN=localStorage.getItem('studyo_token');if(!TOKEN)location.href='index.html';const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};const withToken=p=>API+p+'?token='+encodeURIComponent(TOKEN);fetch(API+'/api/me',{headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.ok?r.json():Promise.reject()).then(async x=>{if(x.type!=='student')throw Error();document.getElementById('who').textContent=x.profile.name;const r=await fetch(API+'/api/materials',{headers:{Authorization:'Bearer '+TOKEN}});const d=await r.json();document.getElementById('list').innerHTML=d.materials.length?d.materials.map(m=>`<div class="material"><b>${esc(m.title)}</b><span class="muted">${esc(m.class)} · ${esc(m.tag)} · ${m.size} bytes</span><br><a href="${withToken(m.url)}" target="_blank">Open material</a></div>`).join(''):'<p class="muted">No materials have been shared yet.</p>'}).catch(()=>location.href='index.html');</script></body></html>

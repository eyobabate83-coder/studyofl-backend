<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studyo - Profile</title><style>body{margin:0;min-height:100vh;background:linear-gradient(145deg,#190c33,#341a52);color:#f4f1fb;font:14px 'Trebuchet MS',sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.brand{font-size:24px;font-weight:bold}.nav{display:flex;gap:6px;overflow:auto;margin:24px 0;padding:6px;border:1px solid #ffffff33;border-radius:14px}.nav a{color:#c9c0e6;padding:10px 13px;text-decoration:none;white-space:nowrap;border-radius:10px}.nav a.active,.nav a:hover{background:#ff9d5c;color:#24102f}.panel{background:#ffffff12;border:1px solid #ffffff2b;border-radius:16px;padding:26px}.profile{display:grid;gap:12px;max-width:520px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff1c;padding:10px 0}.label{color:#c9c0e6}</style></head><body><main class="wrap"><header class="top"><div class="brand">Studyo</div><div id="who"></div></header><nav class="nav"><a href="index.html">Overview</a><a href="student-upload.html">Study materials</a><a href="student-library.html">Digital library</a><a href="student-quizzes.html">Quizzes &amp; tests</a><a class="active" href="student-profile.html">Profile</a></nav><section class="panel"><h1>Student profile</h1><div id="profile" class="profile"></div></section></main><script>const API='https://studyofl-backend.onrender.com',TOKEN=localStorage.getItem('studyo_token');if(!TOKEN)location.href='index.html';fetch(API+'/api/me',{headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.ok?r.json():Promise.reject()).then(x=>{if(x.type!=='student')throw Error();const p=x.profile;document.getElementById('who').textContent=p.name;document.getElementById('profile').innerHTML=`<div class="row"><span class="label">Name</span><b>${p.name}</b></div><div class="row"><span class="label">Student ID</span><b>${p.studentId}</b></div><div class="row"><span class="label">Class</span><b>${p.class}</b></div><div class="row"><span class="label">Points</span><b>${p.points||0}</b></div>`}).catch(()=>location.href='index.html');</script></body></html>

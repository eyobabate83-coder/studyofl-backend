<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studyo - Digital Library</title><style>
:root{--bg:#190c33;--panel:#2b1850;--text:#f4f1fb;--muted:#c9c0e6;--teal:#2dd4bf;--coral:#ff6f5e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#190c33,#341a52);color:var(--text);font:14px 'Trebuchet MS',sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:24px;font-weight:bold}.nav{display:flex;gap:6px;overflow:auto;margin:24px 0;padding:6px;border:1px solid #ffffff33;border-radius:14px}.nav a{color:var(--muted);padding:10px 13px;text-decoration:none;white-space:nowrap;border-radius:10px}.nav a.active,.nav a:hover{background:#ff9d5c;color:#24102f}.panel{background:#ffffff12;border:1px solid #ffffff2b;border-radius:16px;padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{padding:11px;border-radius:10px;border:1px solid #ffffff2b;background:#ffffff12;color:var(--text);font:inherit}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.book{padding:16px;border:1px solid #ffffff20;border-radius:12px;background:#ffffff0d}.book h2{font-size:17px;margin:0 0 8px}.meta{color:var(--muted);font-size:12px}.badge{display:inline-block;margin:10px 4px 12px 0;padding:4px 8px;border-radius:8px;background:#2dd4bf2b;color:#7cefde;font-size:11px}.book a,.logout{display:inline-block;padding:9px 12px;border-radius:9px;text-decoration:none;background:var(--teal);color:#20102f;font-weight:bold;border:0;cursor:pointer}.book a.secondary{background:#ffffff18;color:var(--text);margin-right:6px}.empty{color:var(--muted)}
</style></head><body><main class="wrap"><header class="top"><div class="brand">Studyo</div><div id="who"></div></header><nav class="nav"><a href="index.html">Overview</a><a href="student-upload.html">Study materials</a><a class="active" href="student-library.html">Digital library</a><a href="student-quizzes.html">Quizzes &amp; tests</a><a href="student-profile.html">Profile</a></nav><section class="panel"><h1>Digital library</h1><div class="toolbar"><input id="search" placeholder="Search by title or subject"><select id="subject"><option value="">All subjects</option></select></div><div id="grid" class="grid"></div></section></main><script>
const API='https://studyofl-backend.onrender.com',TOKEN=localStorage.getItem('studyo_token');if(!TOKEN)location.href='index.html';const auth={Authorization:'Bearer '+TOKEN};const url=p=>API+p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN);let items=[];const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};function render(){const q=document.getElementById('search').value.toLowerCase(),sub=document.getElementById('subject').value;const shown=items.filter(x=>(!q||x.title.toLowerCase().includes(q)||x.subject.toLowerCase().includes(q))&&(!sub||x.subject===sub));document.getElementById('grid').innerHTML=shown.length?shown.map(x=>`<article class="book"><h2>${esc(x.title)}</h2><div class="meta">${esc(x.subject)} · ${x.size} bytes</div><span class="badge">Grade ${x.gradeLevel}</span><span class="badge">${Number(x.downloadCount||0)} downloads</span><div><a class="secondary" href="${url(x.viewUrl)}" target="_blank" onclick="refresh()">View</a><a href="${url(x.downloadUrl)}" target="_blank" onclick="refresh()">Download</a></div></article>`).join(''):'<div class="empty">No library resources found.</div>'}async function refresh(){setTimeout(load,500)}async function load(){const r=await fetch(API+'/api/library',{headers:auth});if(!r.ok)return location.href='index.html';const d=await r.json();items=d.items||[];document.getElementById('subject').innerHTML='<option value="">All subjects</option>'+[...new Set(items.map(x=>x.subject))].map(x=>`<option>${esc(x)}</option>`).join('');render()}document.getElementById('search').oninput=render;document.getElementById('subject').onchange=render;fetch(API+'/api/me',{headers:auth}).then(r=>r.ok?r.json():Promise.reject()).then(x=>document.getElementById('who').textContent=x.profile.name).catch(()=>location.href='index.html');load();
</script></body></html>
